  <text x="440" y="165" font-size="12" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">removes secrets</text>
  <text x="440" y="182" font-size="12" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">restores values</text>

  <rect x="680" y="90" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.5"/>
  <text x="760" y="124" font-size="14" fill="#1F1F1F" text-anchor="middle">api.anthropic.com</text>
  <text x="760" y="146" font-size="14" fill="#1F1F1F" text-anchor="middle">api.openai.com</text>
  <text x="760" y="168" font-size="14" fill="#8A8A85" text-anchor="middle">and 12 more</text>

  <line x1="246" y1="125" x2="322" y2="125" stroke="#1F1F1F" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="284" y="114" font-size="11" fill="#8A8A85" text-anchor="middle">request</text>
  <line x1="556" y1="125" x2="672" y2="125" stroke="#1F1F1F" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="614" y="114" font-size="11" fill="#8A8A85" text-anchor="middle">request</text>

  <line x1="322" y1="160" x2="246" y2="160" stroke="#1F1F1F" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="284" y="180" font-size="11" fill="#8A8A85" text-anchor="middle">response</text>
  <line x1="672" y1="160" x2="556" y2="160" stroke="#1F1F1F" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="614" y="180" font-size="11" fill="#8A8A85" text-anchor="middle">response</text>

  <text x="40" y="240" font-size="11" letter-spacing="1.5" fill="#8A8A85">PLACEHOLDER MODE</text>

  <g font-family="Menlo, SF Mono, Consolas, monospace" font-size="12">
    <text x="40" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8A8A85">request</text>
    <rect x="120" y="256" width="200" height="28" rx="6" fill="#EFEFEA"/>
    <text x="132" y="274" fill="#1F1F1F">the key is <tspan fill="#B3261E">sk-ant-api03-…</tspan></text>
