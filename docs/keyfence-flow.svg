  <text x="140" y="146" font-size="14" fill="#1F1F1F" text-anchor="middle">Cursor, Codex</text>
  <text x="140" y="168" font-size="14" fill="#1F1F1F" text-anchor="middle">curl, scripts</text>

  <rect x="330" y="90" width="220" height="100" rx="8" fill="#2E7D5B"/>
