    <rect x="388" y="256" width="186" height="28" rx="6" fill="#EFEFEA"/>
    <text x="400" y="274" fill="#1F1F1F">the key is <tspan fill="#2E7D5B">&lt;&lt;SECRET_1&gt;&gt;</tspan></text>
    <line x1="586" y1="270" x2="630" y2="270" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#head-gray)"/>
    <text x="656" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F1F1F">provider</text>

    <text x="40" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8A8A85">response</text>
    <rect x="120" y="310" width="150" height="28" rx="6" fill="#EFEFEA"/>
    <text x="132" y="328" fill="#1F1F1F">use <tspan fill="#B3261E">sk-ant-api03-…</tspan></text>
    <line x1="376" y1="324" x2="332" y2="324" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#head-gray)"/>
    <rect x="388" y="310" width="136" height="28" rx="6" fill="#EFEFEA"/>
    <text x="400" y="328" fill="#1F1F1F">use <tspan fill="#2E7D5B">&lt;&lt;SECRET_1&gt;&gt;</tspan></text>
    <line x1="630" y1="324" x2="586" y2="324" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#head-gray)"/>
    <text x="656" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F1F1F">provider</text>
