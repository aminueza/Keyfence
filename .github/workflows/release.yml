name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Check CI passed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              per_page: 10
            });

            const ciRun = runs.data.workflow_runs.find(r => r.head_sha === sha && r.name === 'CI');

            if (!ciRun) {
              core.setFailed('No CI workflow run found for this commit');
              return;
            }

            if (ciRun.conclusion !== 'success') {
              core.setFailed(`CI workflow run ${ciRun.id} concluded with ${ciRun.conclusion}`);
              return;
            }

            console.log(`CI workflow run ${ciRun.id} passed`);

  build:
    needs: check-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: |
          pip install dist/*.whl
          keyfence --help
          test "v$(python -c 'import keyfence; print(keyfence.__version__)')" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
