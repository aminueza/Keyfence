name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Check CI passed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const POLL_INTERVAL_MS = 20000;
            const POLL_TIMEOUT_MS = 30 * 60 * 1000;
            const deadline = Date.now() + POLL_TIMEOUT_MS;
            const minutes = POLL_TIMEOUT_MS / 60000;

            let latest = null;
            let finished = null;
            let timedOut = false;

            while (!finished) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 10
              });

              const found = runs.data.workflow_runs.find(r => r.head_sha === sha && r.name === 'CI') ?? null;
              latest = found;

              if (found && found.status === 'completed') {
                finished = found;
                break;
              }

              if (Date.now() >= deadline) {
                timedOut = true;
                break;
              }

              core.info(`CI run for ${sha} is ${found ? found.status : 'not registered'}; polling again in ${POLL_INTERVAL_MS} ms`);
              await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
            }

            if (timedOut && !latest) {
              core.setFailed(`No CI workflow run found for commit ${sha} after ${minutes} minutes of polling`);
              return;
            }

            if (timedOut) {
              core.setFailed(`CI workflow run ${latest.id} was still ${latest.status} after ${minutes} minutes`);
              return;
            }

            if (finished.conclusion !== 'success') {
              core.setFailed(`CI workflow run ${finished.id} concluded with ${finished.conclusion}`);
              return;
            }

            console.log(`CI workflow run ${finished.id} passed`);

  build:
    needs: check-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: |
          pip install dist/*.whl
          keyfence --help
          test "v$(python -c 'import keyfence; print(keyfence.__version__)')" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - run: python tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
