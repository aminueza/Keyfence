name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Check CI passed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              per_page: 10
            });

            const ciRun = runs.data.workflow_runs.find(r => r.head_sha === sha && r.name === 'CI');

            if (!ciRun) {
              core.setFailed('No CI workflow run found for this commit');
              return;
            }

            if (ciRun.conclusion !== 'success') {
              core.setFailed(`CI workflow run ${ciRun.id} concluded with ${ciRun.conclusion}`);
              return;
            }

            console.log(`CI workflow run ${ciRun.id} passed`);

  build:
    needs: check-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: |
          pip install dist/*.whl
          keyfence --help
          test "v$(python -c 'import keyfence; print(keyfence.__version__)')" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
