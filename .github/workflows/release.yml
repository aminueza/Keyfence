name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Check CI passed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const POLL_INTERVAL_MS = 20000;
            const POLL_TIMEOUT_MS = 30 * 60 * 1000;
            const deadline = Date.now() + POLL_TIMEOUT_MS;
            const minutes = POLL_TIMEOUT_MS / 60000;

            let latest = null;
            let finished = null;
            let timedOut = false;

            while (!finished) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                event: 'push',
                branch: 'main',
                head_sha: sha,
                per_page: 10
              });

              const found = runs.data.workflow_runs.find(r => r.head_sha === sha
                && r.path === '.github/workflows/ci.yml'
                && r.event === 'push') ?? null;
              latest = found;

              if (found && found.status === 'completed') {
                finished = found;
                break;
              }

              if (Date.now() >= deadline) {
                timedOut = true;
                break;
              }

              core.info(`CI run for ${sha} is ${found ? found.status : 'not registered'}; polling again in ${POLL_INTERVAL_MS} ms`);
              await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
            }

            if (timedOut && !latest) {
              core.setFailed(`No CI workflow run found for commit ${sha} after ${minutes} minutes of polling`);
              return;
            }

            if (timedOut) {
              core.setFailed(`CI workflow run ${latest.id} was still ${latest.status} after ${minutes} minutes`);
              return;
            }

            if (finished.conclusion !== 'success') {
              core.setFailed(`CI workflow run ${finished.id} concluded with ${finished.conclusion}`);
              return;
            }

            console.log(`CI workflow run ${finished.id} passed`);

      - name: Check the tagged commit is on main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const ancestry = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${sha}...main`
            });
            if (ancestry.data.status !== 'ahead' && ancestry.data.status !== 'identical') {
              core.setFailed(`Commit ${sha} is ${ancestry.data.status} of main, so its suite never ran on main`);
              return;
            }
            core.info(`Commit ${sha} is on main`);

  build:
    needs: check-ci
    runs-on: ubuntu-24.04
    outputs:
      dist-sha256: ${{ steps.digest.outputs.dist-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-release.txt
      - run: python tools/release_notes.py "${GITHUB_REF_NAME}" > /dev/null
      - run: python -m build --no-isolation
      - id: digest
        run: echo "dist-sha256=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  sbom:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-release.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - run: |
          python -m venv wheel-env
          wheel-env/bin/pip install dist/*.whl
          wheel-env/bin/keyfence --help
          test "v$(wheel-env/bin/python -c 'import keyfence; print(keyfence.__version__)')" = "${GITHUB_REF_NAME}"
      - run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json wheel-env/bin/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - run: |
          echo "$DIST_SHA256" | base64 -d > dist.sha256
          test "$(ls dist | sort)" = "$(awk '{print $2}' dist.sha256 | sort)"
          (cd dist && sha256sum -c ../dist.sha256)
        env:
          DIST_SHA256: ${{ needs.build.outputs.dist-sha256 }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - run: |
          echo "$DIST_SHA256" | base64 -d > dist.sha256
          test "$(ls dist | sort)" = "$(awk '{print $2}' dist.sha256 | sort)"
          (cd dist && sha256sum -c ../dist.sha256)
        env:
          DIST_SHA256: ${{ needs.build.outputs.dist-sha256 }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: sbom/
      - run: python tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - run: gh release create "${GITHUB_REF_NAME}" dist/* sbom/sbom.cdx.json --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
