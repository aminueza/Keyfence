name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest --cov=keyfence --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: bash tests/integration_test.sh

  package:
    name: build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build cyclonedx-bom
      - run: python -m build
      - run: pip install dist/*.whl && keyfence --help
      - run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'keyfence/rules/gitleaks.toml' in names, names"
      - run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
      - run: npx --yes @anthropic-ai/claude-code plugin validate ./plugin
