name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest --cov=keyfence --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: bash tests/integration_test.sh

  package:
    name: build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-release.txt
      - run: python -m build --no-isolation
      - run: pip install dist/*.whl && keyfence --help
      - run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'keyfence/rules/gitleaks.toml' in names, names"
      - run: |
          python - <<'PY'
          import glob
          import tarfile

          names = tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames()
          root = names[0].split('/')[0]
          shipped = [n for n in names if n.startswith(f'{root}/tests/')]
          assert not shipped, f'the sdist carries tests: {shipped[:5]}'
          for needed in ('LICENSE', 'keyfence/rules/gitleaks.toml', 'keyfence/rules/GITLEAKS-LICENSE'):
              assert f'{root}/{needed}' in names, f'the sdist is missing {needed}'
          PY
      - run: |
          python -m venv sbom-env
          sbom-env/bin/pip install dist/*.whl
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json sbom-env/bin/python
      - run: python -c "import json; names={c['name'] for c in json.load(open('sbom.cdx.json'))['components']}; assert 'keyfence' in names and not names & {'cyclonedx-bom', 'build'}, sorted(names)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.cdx.json
      - run: npx --yes @anthropic-ai/claude-code@2.1.282 plugin validate ./plugin

  image:
    name: build the Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t keyfence-ci .
      - run: docker run --rm --entrypoint keyfence keyfence-ci --help
