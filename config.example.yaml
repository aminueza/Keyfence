# Copy to ~/.keyfence/config.yaml and adjust.

# What to do when a secret is found in a request to an AI provider:
#   block       -> refuse the request (403); nothing leaves your machine
#   redact      -> replace the secret with [REDACTED:<kind>] and let it through
#   placeholder -> replace with <<SECRET_n>> on the way out and restore the real
#                  value in the response (streaming included)
mode: redact

# Extra hosts to monitor (the major AI providers are already included)
extra_hosts:
  # - api.my-company.com

# true = scan ALL HTTPS traffic, not only AI providers (slower)
intercept_all_hosts: false

# When a request was changed, add a short note to the system prompt telling the
# model that the [REDACTED:...] / <<SECRET_n>> tokens are expected, so it does
# not warn the user or suggest rotating credentials, and keeps placeholders intact.
notice: true

scan:
  patterns: true          # built-in formats (OpenAI, Anthropic, AWS, GitHub, ...)
  gitleaks: true          # 200+ additional formats from the bundled gitleaks ruleset
  # gitleaks_rules: ~/my-gitleaks.toml   # use your own gitleaks-compatible ruleset
  gitleaks_disabled:      # rule ids to skip; generic-api-key is noisy on prose and code
    - generic-api-key
  entropy: true           # high-entropy strings that look like secrets
  entropy_min_length: 24
  entropy_threshold: 4.5
  entropy_max_length: 512   # longer strings are encoded data, not credentials
  allowlist: []           # exact values never treated as secrets
    # - "sk-fake-key-used-in-this-projects-tests"

# audit_log: ~/.keyfence/audit.log
